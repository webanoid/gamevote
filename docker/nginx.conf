# Basic auth realm per request: off for /up, Laravel's health check (used by Railway).
map $request_uri $basic_auth_realm {
    ~^/up(\?.*)?$ off;
    default "GameVote";
}

# HSTS only for requests a TLS-terminating proxy (Railway) reports as https; empty means not sent.
map $http_x_forwarded_proto $hsts_header {
    https "max-age=31536000";
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;

    # Don't advertise the nginx version. The Content-Security-Policy comes from Laravel
    # (it needs a per-request nonce); these headers apply to every response.
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security $hsts_header always;

    # HTTP basic auth when HTTP_AUTH_PASSWORD is set; empty otherwise (see nginx-http-auth.sh).
    include /etc/nginx/snippets/http-auth.conf;

    index index.php;
    charset utf-8;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Fingerprinted Vite assets can be cached forever
    location /build/assets/ {
        # add_header here replaces the server-level headers, so repeat the one that matters for assets.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Laravel's response headers (Content-Security-Policy, the asset preload Link header and
        # cookies) outgrow the default 4-8 KB buffer, which nginx answers with a 502.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
