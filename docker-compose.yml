services:
    # Production-like stack: `docker compose up --build` -> http://localhost:8000
    # nginx serves static files and proxies PHP requests to the app (PHP-FPM)
    web:
        build:
            context: .
            target: web
        ports:
            - '${APP_PORT:-8000}:80'
        environment:
            # Optional HTTP basic auth for the whole site; off when the password is empty.
            HTTP_AUTH_USER: ${HTTP_AUTH_USER:-}
            HTTP_AUTH_PASSWORD: ${HTTP_AUTH_PASSWORD:-}
        depends_on:
            app:
                condition: service_healthy

    app:
        build:
            context: .
            target: production
        healthcheck:
            test:
                - CMD
                - php
                - -r
                - "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"
            interval: 5s
            timeout: 3s
            retries: 3
            start_period: 30s
        environment:
            APP_NAME: GameVote
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_URL: http://localhost:${APP_PORT:-8000}
            APP_KEY: ${DOCKER_APP_KEY:-}
            DB_CONNECTION: sqlite
            DB_DATABASE: /data/database.sqlite
            LOG_CHANNEL: stderr
            API_KEY_ESSENCE: ${API_KEY_ESSENCE:-}
        volumes:
            - sqlite-data:/data

    # Development with hot reload: `docker compose --profile dev up dev`
    # App on http://localhost:8000, Vite dev server on http://localhost:5173
    dev:
        profiles: [dev]
        build:
            context: .
            target: dev
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        user: '${UID:-1000}:${GID:-1000}'
        environment:
            # Makes laravel-vite-plugin listen on 0.0.0.0 and advertise localhost
            LARAVEL_SAIL: '1'
        # Local machine only: the dev server runs with APP_DEBUG=true and Vite serves source files.
        ports:
            - '127.0.0.1:${APP_PORT:-8000}:8000'
            - '127.0.0.1:5173:5173'
        volumes:
            - .:/var/www/html
            - node-modules:/var/www/html/node_modules

volumes:
    sqlite-data:
    node-modules:
